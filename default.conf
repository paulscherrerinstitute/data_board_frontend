server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    location /api/ {
        proxy_pass ${DATA_BOARD_INTERNAL_BACKEND_URL}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/maintenance/ {
        deny all;
    }
}

server {
    listen 443 ssl;
    server_name localhost databoard.psi.ch databoard-00.psi.ch;

    ssl_certificate /etc/letsencrypt/live/databoard-00.psi.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/databoard-00.psi.ch/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    location /api/ {
        proxy_pass ${DATA_BOARD_INTERNAL_BACKEND_URL}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/maintenance/ {
        deny all;
    }
}